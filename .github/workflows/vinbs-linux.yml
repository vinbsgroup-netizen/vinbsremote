# Builds the VinBS Remote Desktop .deb for Ubuntu and Debian (x86_64) and publishes it to the
# linux-latest pre-release.
# The build steps follow build-rustdesk-linux in flutter-build.yml; keep the pinned versions in sync.
name: VinBS Linux

on:
  workflow_dispatch:
  push:
    branches:
      - android-build

permissions:
  contents: write

# A slower run of an older commit must not finish last and overwrite a newer package.
concurrency:
  group: vinbs-linux
  cancel-in-progress: true

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-linux:
    needs: [generate-bridge]
    # bridge.yml also builds a Flutter 3.44 bridge that Linux does not use, so a failure there
    # must not skip this job. A failed 3.24 bridge still stops it at "Restore bridge files".
    if: ${{ !cancelled() }}
    name: build x86_64 deb
    runs-on: ubuntu-22.04
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Maximize build space
        run: |
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo apt-get update -y
          sudo apt-get install -y nasm qemu-user-static

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # v1.0
        with:
          swap-size-gb: 12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - name: Save Rust toolchain version
        run: |
          RUST_TOOLCHAIN_VERSION=$(cargo --version | awk '{print $2}')
          echo "RUST_TOOLCHAIN_VERSION=$RUST_TOOLCHAIN_VERSION" >> $GITHUB_ENV

      - name: Disable rust bridge build
        run: |
          # only build cdylib
          sed -i  "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/\[\"cdylib\"\]/g" Cargo.toml

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          sudo apt install -y libva-dev && apt show libva-dev
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-linux \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      # The container's meson is too old to build libdrmtap, so build it here from the pin in
      # build.py and hand the .so to the container below via DRMTAP_PREBUILT_DIR.
      - name: Build libdrmtap
        run: |
          sudo apt-get install -y meson ninja-build pkg-config \
            libdrm-dev libegl1-mesa-dev libgles2-mesa-dev
          python3 - <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location("b", "build.py")
          b = importlib.util.module_from_spec(spec)
          sys.argv = ["build.py"]
          spec.loader.exec_module(b)
          print(f"::notice::built {b.build_libdrmtap_so()}")
          PY
        shell: bash

      # Built in an Ubuntu 18.04 container for an old glibc floor. libdrmtap comes from the newer
      # runner above, so build.py measures the floor from it and writes it into the deb's Depends.
      - uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8 # no release tag; commit 2026-05-26
        name: Build deb
        with:
          arch: x86_64
          distro: ubuntu18.04
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
            --volume "/opt/artifacts:/opt/artifacts"
          shell: /bin/bash
          install: |
            apt-get update -y
            apt-get install -y \
               build-essential \
               clang \
               cmake \
               curl \
               gcc \
               git \
               g++ \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libclang-10-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-10-dev \
               nasm \
               ninja-build \
               pkg-config \
               tree \
               python3 \
               rpm \
               unzip \
               wget \
               xz-utils \
               libssl-dev
            # libopus comes from vcpkg.
            apt-get remove -y libopus-dev || true
          run: |
            git config --global --add safe.directory "*"
            # rustup runs out of memory here, so install from the tarball.
            pushd /opt
            wget -O rust.tar.gz https://static.rust-lang.org/dist/rust-${{ env.RUST_TOOLCHAIN_VERSION }}-x86_64-unknown-linux-gnu.tar.gz
            tar -zxvf rust.tar.gz > /dev/null && rm rust.tar.gz
            cd rust-${{ env.RUST_TOOLCHAIN_VERSION }}-x86_64-unknown-linux-gnu && ./install.sh
            rm -rf rust-${{ env.RUST_TOOLCHAIN_VERSION }}-x86_64-unknown-linux-gnu
            mkdir -p ~/.cargo/
            echo """
              [source.crates-io]
              registry = 'https://github.com/rust-lang/crates.io-index'
            """ > ~/.cargo/config
            pushd /workspace
            export VCPKG_ROOT=/opt/artifacts/vcpkg
            # The drm backend captures Wayland without the portal's share prompt, so a peer can be
            # reached with its ID and password when nobody is at the machine.
            export DRMTAP_PREBUILT_DIR=/workspace/third_party/libdrmtap/build-pkg
            FEATURES=$(python3 ./build.py --flutter --drm --hwcodec --unix-file-copy-paste --print-features)
            cargo build --locked --lib --features "$FEATURES" --release
            rm -rf target/release/deps target/release/build
            rm -rf ~/.cargo

            export PATH=/opt/flutter/bin:$PATH
            pushd /opt
            wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            tar xf flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            flutter doctor -v
            pushd /opt/flutter
            git apply /workspace/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
            popd

            pushd /workspace
            export CARGO_INCREMENTAL=0
            export DEB_ARCH=amd64
            python3 ./build.py --flutter --drm --hwcodec --unix-file-copy-paste --skip-cargo
            bash ./res/vinbs-deb-rename.sh rustdesk-unattended-wayland-${{ env.VERSION }}.deb vinbs-remote-desktop-${{ env.VERSION }}-x86_64.deb

      # A deb missing the library still installs and runs, then falls back to the portal prompt with
      # no error, so check the artifact before it replaces the published one.
      - name: Check the deb is a drm build
        run: |
          set -euo pipefail
          deb=vinbs-remote-desktop-${{ env.VERSION }}-x86_64.deb
          contents="$(dpkg -c "$deb")"
          if [[ ! "$contents" =~ usr/lib/rustdesk/libdrmtap\.so\.0\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::$deb has no versioned libdrmtap.so.0.x.y"
            exit 1
          fi
          if [[ "$contents" != *"usr/lib/rustdesk/libdrmtap.so.0 ->"* ]]; then
            echo "::error::$deb has no libdrmtap.so.0 soname symlink"
            exit 1
          fi
          rm -rf /tmp/deb && dpkg-deb -R "$deb" /tmp/deb
          if ! grep -qF /usr/lib/rustdesk/libdrmtap.so.0 /tmp/deb/usr/share/vinbsremote/lib/librustdesk.so; then
            echo "::error::$deb was not built with the drm feature"
            exit 1
          fi
        shell: bash

      - name: Publish deb
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: linux-latest
          files: vinbs-remote-desktop-${{ env.VERSION }}-x86_64.deb
